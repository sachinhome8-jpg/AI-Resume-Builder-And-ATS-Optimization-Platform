<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HireReady - Custom Interview Strategy &amp; Resume Preparation</title>
    <style>
      /* Instant Zero-Delay Preloader Styles */
      body {
        margin: 0;
        padding: 0;
        background-color: #090d16;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow-x: hidden;
      }
      #initial-preloader {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at 50% 35%, rgba(255, 45, 120, 0.12) 0%, #090d16 75%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .preloader-card {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(255, 45, 120, 0.25);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 45, 120, 0.15);
        border-radius: 24px;
        padding: 40px 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 440px;
        width: 90%;
        gap: 20px;
      }
      .preloader-radar {
        position: relative;
        width: 80px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .preloader-ring-1 {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #ff2d78;
        border-right-color: rgba(255, 45, 120, 0.4);
        animation: preloaderSpin 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .preloader-ring-2 {
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-bottom-color: #a855f7;
        border-left-color: rgba(168, 85, 247, 0.4);
        animation: preloaderSpinRev 1.4s linear infinite;
      }
      .preloader-core {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(255, 45, 120, 0.3), rgba(168, 85, 247, 0.3));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        box-shadow: 0 0 16px rgba(255, 45, 120, 0.5);
      }
      .preloader-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        background: rgba(255, 45, 120, 0.12);
        border: 1px solid rgba(255, 45, 120, 0.3);
        border-radius: 999px;
        color: #ff498b;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
      .preloader-title {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: #ffffff;
        margin: 0;
      }
      .preloader-title span {
        background: linear-gradient(135deg, #ff2d78, #a855f7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .preloader-subtitle {
        font-size: 13px;
        color: #94a3b8;
        margin: 0;
        line-height: 1.4;
      }
      .preloader-bar-bg {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .preloader-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #ff2d78, #a855f7, #06b6d4);
        border-radius: 999px;
        width: 45%;
        animation: preloaderBar 1.8s ease-in-out infinite alternate;
      }
      @keyframes preloaderSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes preloaderSpinRev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes preloaderBar {
        0% { width: 15%; transform: translateX(0%); }
        50% { width: 65%; }
        100% { width: 90%; transform: translateX(10%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-preloader">
        <div class="preloader-card">
          <div class="preloader-radar">
            <div class="preloader-ring-1"></div>
            <div class="preloader-ring-2"></div>
            <div class="preloader-core">🎯</div>
          </div>
          <div class="preloader-badge">⚡ Booting Workspace</div>
          <h1 class="preloader-title">Hire<span>Ready</span></h1>
          <p class="preloader-subtitle">Loading your personalized interview strategy &amp; ATS platform...</p>
          <div class="preloader-bar-bg">
            <div class="preloader-bar-fill"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
